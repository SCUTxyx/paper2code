name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run full test suite (calibration + examples + tooling)
        run: python -m pytest -q
      - name: Run calibration script (exit-code gate)
        run: bash scripts/run_calibration.sh
        env:
          PYTHON: python
